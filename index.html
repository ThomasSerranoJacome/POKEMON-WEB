<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Pokédex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Acerca de Pokemones</h1>

  <div class="filtros">

    <div class="filtro">
      <input type="text" id="input" placeholder="Nombre o número (ej: pikachu, 25)">
      <button onclick="buscarPokemon()">Buscar</button>
      <div id="resultado"></div>
    </div>

    <div class="filtro">
      <select id="selectTipo">
        <option value="">-- Selecciona un tipo --</option>
      </select>
      <button onclick="buscarPorTipo()">Buscar por tipo</button>
      <div id="resultadoTipo"></div>
    </div>

    <div class="filtro">
      <input type="text" id="inputEvo" placeholder="Nombre o número (ej: pikachu, 25)">
      <button onclick="buscarEvolucion()">Ver evoluciones</button>
      <div id="resultadoEvo"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
